<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Relay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #111; color: #fff; font-family: system-ui; }
.wrap {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; padding: 20px;
}
h1 { font-size: 20px; font-weight: 500; margin-bottom: 24px; color: #aaa; }
.form { width: 100%; max-width: 300px; }
input[type="password"] {
  width: 100%; height: 44px; border: 1px solid #333; border-radius: 8px;
  background: #222; color: #fff; padding: 0 14px; font-size: 16px; outline: none;
  -webkit-appearance: none;
}
input[type="password"]:focus { border-color: #666; }
button {
  width: 100%; height: 44px; margin-top: 12px; border: none; border-radius: 8px;
  background: #fff; color: #111; font-size: 16px; font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}
button:active { background: #ccc; }
#error { color: #f66; margin-top: 12px; font-size: 14px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Browser Relay</h1>
  <div class="form">
    <input id="pw" type="password" placeholder="密码" autofocus>
    <button id="btn" onclick="login()">进入</button>
    <div id="error">密码错误</div>
  </div>
</div>
<script>
async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function login() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  const hash = await sha256(pw);
  // 哈希放请求头发给服务器，验证通过后由服务器下发 HttpOnly cookie，页面 JS 摸不到
  const resp = await fetch('/', { headers: { 'X-Relay-Auth': hash }, credentials: 'same-origin' });
  if (resp.status === 204) {
    location.reload();
  } else {
    document.getElementById('error').style.display = 'block';
  }
}
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
